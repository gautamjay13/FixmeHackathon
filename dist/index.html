<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On-Demand Home Services Platform</title>
    <style>
      /* --- Loader CSS --- */
      body {
        margin: 0;
      }
      .sl-loader-container {
        position: fixed;
        inset: 0;
        background-color: #0a0a0f;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .sl-loader-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .sl-bg-glow {
        position: absolute;
        width: 60vw;
        height: 60vw;
        max-width: 600px;
        max-height: 600px;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(10, 10, 15, 0) 70%);
        border-radius: 50%;
        animation: sl-breathe 4s ease-in-out infinite;
      }
      @keyframes sl-breathe {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
      }

      /* Rings */
      .sl-rings-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
      }
      .sl-ring {
        position: absolute;
        border-radius: 50%;
        border: 2px solid transparent;
      }
      .sl-ring-1 {
        width: 100%;
        height: 100%;
        border-top-color: #6366f1;
        border-left-color: #6366f1;
        animation: sl-spin 2s linear infinite;
      }
      .sl-ring-2 {
        width: 80%;
        height: 80%;
        border-bottom-color: #8b5cf6;
        border-right-color: #8b5cf6;
        animation: sl-spin-reverse 1.5s linear infinite;
      }
      .sl-ring-3 {
        width: 60%;
        height: 60%;
        border-top-color: #a78bfa;
        animation: sl-spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }
      .sl-core {
        width: 20%;
        height: 20%;
        background-color: #a78bfa;
        border-radius: 50%;
        box-shadow: 0 0 20px #8b5cf6, 0 0 40px #6366f1;
        animation: sl-pulse 1.5s ease-in-out infinite;
      }
      @keyframes sl-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes sl-spin-reverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes sl-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.7; }
      }

      /* Dot Wave */
      .sl-dots {
        display: flex;
        gap: 6px;
        margin-bottom: 24px;
        z-index: 1;
      }
      .sl-dot {
        width: 8px;
        height: 8px;
        background-color: #8b5cf6;
        border-radius: 50%;
        animation: sl-wave 1.2s ease-in-out infinite;
      }
      .sl-dot:nth-child(1) { animation-delay: 0s; }
      .sl-dot:nth-child(2) { animation-delay: 0.1s; }
      .sl-dot:nth-child(3) { animation-delay: 0.2s; }
      .sl-dot:nth-child(4) { animation-delay: 0.3s; }
      .sl-dot:nth-child(5) { animation-delay: 0.4s; }

      @keyframes sl-wave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); background-color: #a78bfa; }
      }

      /* Text */
      .sl-text {
        color: #a78bfa;
        font-size: 14px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 24px;
        min-width: 150px;
        text-align: center;
        z-index: 1;
      }

      /* Progress bar */
      .sl-progress-wrapper {
        width: 200px;
        height: 2px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }
      .sl-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
        transition: width 0.1s linear;
      }

      /* Particles */
      .sl-particle {
        position: absolute;
        bottom: -10px;
        background-color: rgba(167, 139, 250, 0.5);
        border-radius: 50%;
        animation: sl-float infinite linear;
      }
      @keyframes sl-float {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CWx07l34.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BqzEvTgQ.css">
  </head>

  <body>
    <!-- --- Loader HTML --- -->
    <div class="sl-loader-container" id="sl-loader">
      <div class="sl-bg-glow"></div>
      
      <div class="sl-rings-wrapper">
        <div class="sl-ring sl-ring-1"></div>
        <div class="sl-ring sl-ring-2"></div>
        <div class="sl-ring sl-ring-3"></div>
        <div class="sl-core"></div>
      </div>

      <div class="sl-dots">
        <div class="sl-dot"></div>
        <div class="sl-dot"></div>
        <div class="sl-dot"></div>
        <div class="sl-dot"></div>
        <div class="sl-dot"></div>
      </div>

      <div class="sl-text" id="sl-text">Loading</div>

      <div class="sl-progress-wrapper">
        <div class="sl-progress-bar" id="sl-progress-bar"></div>
      </div>
    </div>

    <!-- Main App Root -->
    <div id="root"></div>

    <!-- --- Loader JS --- -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Setup Particles
        const container = document.getElementById('sl-loader');
        for (let i = 0; i < 20; i++) {
          const particle = document.createElement('div');
          particle.className = 'sl-particle';
          const size = Math.random() * 4 + 1;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.left = Math.random() * 100 + 'vw';
          particle.style.animationDuration = Math.random() * 3 + 3 + 's';
          particle.style.animationDelay = Math.random() * 2 + 's';
          container.appendChild(particle);
        }

        // Texts
        const texts = ["Loading", "Preparing", "Almost there", "Ready"];
        const textEl = document.getElementById('sl-text');
        let textIndex = 0;
        const textInterval = setInterval(() => {
          textIndex++;
          if (textIndex < texts.length) {
            textEl.textContent = texts[textIndex];
          }
        }, 800);

        // Progress Bar
        const progressBar = document.getElementById('sl-progress-bar');
        let progress = 0;
        const duration = 3000;
        const interval = 30;
        const step = (100 / (duration / interval));
        
        const progressTimer = setInterval(() => {
          progress += step;
          progressBar.style.width = Math.min(progress, 100) + '%';
          if (progress >= 100) {
            clearInterval(progressTimer);
          }
        }, interval);

        // Hide loader after 3 seconds
        setTimeout(() => {
          clearInterval(textInterval);
          clearInterval(progressTimer);
          textEl.textContent = "Ready";
          progressBar.style.width = "100%";
          container.classList.add('sl-loader-hidden');
          
          // Remove from DOM after fade out transition
          setTimeout(() => {
            if (container && container.parentNode) {
              container.parentNode.removeChild(container);
            }
          }, 800);
        }, 3000);
      });
    </script>
  </body>
</html>
